<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SagarDrishti, explained from zero</title>
<style>
@page { size: A4; margin: 17mm 16mm 18mm 16mm; }
@page :first { margin: 0; }

:root{
  --navy:#1F4E79; --teal:#11777A; --coral:#C03A2B;
  --ink:#16202A; --muted:#5A6B78; --rule:#D3DCE3; --paper:#F4F7F9;
  --wash:#F8FAFB;
}
*{ box-sizing:border-box; }
html{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
body{
  font:10.5pt/1.62 Georgia,"Cambria",serif; color:var(--ink);
  margin:0; hyphens:none;
}
h1,h2,h3,h4,.ui{ font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif; }
code,kbd,.mono{ font-family:Consolas,"Courier New",monospace; font-size:.88em; }

/* ---------- cover ---------- */
.cover{
  height:297mm; padding:30mm 22mm 20mm; color:#fff;
  background:linear-gradient(158deg,#0B2136 0%,#1F4E79 52%,#11777A 100%);
  display:flex; flex-direction:column; page-break-after:always; position:relative;
}
.cover .kicker{ font:600 9.5pt/1.5 "Segoe UI",sans-serif; letter-spacing:.22em;
  text-transform:uppercase; color:#8FD3D6; }
.cover h1{ font-size:40pt; line-height:1.03; margin:14mm 0 0; font-weight:700;
  letter-spacing:-.015em; }
.cover h1 small{ display:block; font-size:16pt; font-weight:400; color:#BFE3E5;
  margin-top:5mm; letter-spacing:0; line-height:1.35; }
.cover .lede{ font:12pt/1.65 Georgia,serif; color:#DCEAF0; margin-top:11mm;
  max-width:132mm; }
.cover .meta{ margin-top:auto; border-top:1px solid rgba(255,255,255,.28);
  padding-top:6mm; display:grid; grid-template-columns:repeat(4,1fr); gap:5mm;
  font:9pt/1.5 "Segoe UI",sans-serif; }
.cover .meta b{ display:block; color:#8FD3D6; font-weight:600; font-size:7.6pt;
  letter-spacing:.14em; text-transform:uppercase; margin-bottom:1.6mm; }

/* ---------- structure ---------- */
.part{ page-break-before:always; }
.partmark{ font:600 8.6pt/1 "Segoe UI",sans-serif; letter-spacing:.24em;
  text-transform:uppercase; color:var(--teal); margin-bottom:3mm; }
h2{ font-size:19pt; line-height:1.18; margin:0 0 4mm; color:var(--navy);
  font-weight:700; letter-spacing:-.01em; }
h3{ font-size:12.4pt; line-height:1.3; margin:8mm 0 2.5mm; color:var(--navy);
  font-weight:600; page-break-after:avoid; }
h4{ font-size:10.4pt; margin:6mm 0 1.5mm; color:var(--ink); font-weight:600;
  page-break-after:avoid; }
p{ margin:0 0 3.2mm; }
.sub{ color:var(--muted); font-size:10pt; margin:-2mm 0 6mm; }
ul,ol{ margin:0 0 3.6mm; padding-left:5.5mm; }
li{ margin-bottom:1.6mm; }
a{ color:var(--teal); text-decoration:none; }
strong{ font-weight:700; }
.lead{ font-size:11.4pt; line-height:1.6; color:#233240; }

/* ---------- devices ---------- */
table{ width:100%; border-collapse:collapse; margin:3mm 0 5mm;
  font:9.2pt/1.45 "Segoe UI",sans-serif; page-break-inside:avoid; }
th{ text-align:left; background:var(--navy); color:#fff; font-weight:600;
  padding:2mm 2.4mm; font-size:8.4pt; letter-spacing:.04em; }
td{ padding:2mm 2.4mm; border-bottom:.6pt solid var(--rule); vertical-align:top; }
tr:nth-child(even) td{ background:var(--wash); }
td code{ font-size:8.4pt; }

.callout{ border-left:2.6pt solid var(--teal); background:var(--wash);
  padding:3.4mm 4mm; margin:4mm 0; page-break-inside:avoid; }
.callout.warn{ border-left-color:var(--coral); }
.callout.navy{ border-left-color:var(--navy); }
.callout p:last-child{ margin-bottom:0; }
.callout .lbl{ font:600 7.8pt/1 "Segoe UI",sans-serif; letter-spacing:.16em;
  text-transform:uppercase; color:var(--teal); display:block; margin-bottom:2mm; }
.callout.warn .lbl{ color:var(--coral); }
.callout.navy .lbl{ color:var(--navy); }

figure{ margin:5mm 0; page-break-inside:avoid; }
figure img{ width:100%; display:block; border:.6pt solid var(--rule); }
figcaption{ font:8.6pt/1.4 "Segoe UI",sans-serif; color:var(--muted);
  margin-top:1.8mm; }
figcaption b{ color:var(--navy); font-weight:600; }
.duo{ display:grid; grid-template-columns:1fr 1fr; gap:4mm; }
.trio{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:3mm; }

.stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:3mm; margin:4mm 0 5mm; }
.stat{ background:var(--wash); border-top:2.2pt solid var(--teal); padding:3mm; }
.stat b{ display:block; font:700 16pt/1.1 "Segoe UI",sans-serif; color:var(--navy); }
.stat span{ font:8.4pt/1.35 "Segoe UI",sans-serif; color:var(--muted);
  display:block; margin-top:1.2mm; }

.pill{ display:inline-block; background:var(--navy); color:#fff; padding:.5mm 2mm;
  border-radius:2mm; font:600 7.8pt "Segoe UI",sans-serif; letter-spacing:.04em; }
.pill.t{ background:var(--teal); } .pill.c{ background:var(--coral); }
.pill.g{ background:var(--muted); }

.gloss dt{ font-weight:700; color:var(--navy); margin-top:3mm; font-size:10pt; }
.gloss dd{ margin:.6mm 0 0; padding-left:0; }

.refs{ font-size:8.8pt; line-height:1.5; }
.refs li{ margin-bottom:1.8mm; }

.toc{ font:10pt/1.9 "Segoe UI",sans-serif; }
.toc a{ color:var(--ink); }
.toc .n{ color:var(--teal); font-weight:600; display:inline-block; width:9mm; }
.toc .pg{ float:right; color:var(--muted); }
.toc .l2{ padding-left:9mm; font-size:9.2pt; color:var(--muted); line-height:1.7; }

.flow{ width:100%; margin:4mm 0 5mm; page-break-inside:avoid; }
.hr{ border:0; border-top:.8pt solid var(--rule); margin:7mm 0; }
.endnote{ font:8.6pt/1.5 "Segoe UI",sans-serif; color:var(--muted);
  border-top:.6pt solid var(--rule); padding-top:2.5mm; margin-top:6mm; }

.coverpts{ margin-top:13mm; display:grid; grid-template-columns:1fr 1fr;
  gap:6mm 9mm; max-width:150mm; }
.coverpts div{ font:9.6pt/1.5 Georgia,serif; color:#D2E5EC;
  border-top:1px solid rgba(143,211,214,.45); padding-top:3mm; }
.coverpts b{ display:block; font:700 8.4pt/1 "Segoe UI",sans-serif; color:#8FD3D6;
  letter-spacing:.18em; margin-bottom:2mm; }

/* compact edition */
body{ font-size:9.8pt; line-height:1.52; }
h2{ font-size:17pt; margin-bottom:3mm; }
h3{ font-size:11.4pt; margin:6mm 0 2mm; }
h4{ font-size:9.9pt; margin:4mm 0 1mm; }
p{ margin:0 0 2.4mm; }
.lead{ font-size:10.6pt; }
.sub{ margin:-1.5mm 0 4mm; font-size:9.4pt; }
table{ font-size:8.5pt; margin:2mm 0 4mm; }
th{ padding:1.5mm 2mm; font-size:7.9pt; }
td{ padding:1.5mm 2mm; }
.callout{ padding:2.6mm 3.2mm; margin:3mm 0; }
figure{ margin:3.5mm 0; }
figcaption{ font-size:8pt; margin-top:1.2mm; }
.stats{ gap:2.5mm; margin:3mm 0 4mm; }
.stat{ padding:2.4mm; }
.stat b{ font-size:14pt; }
.stat span{ font-size:7.8pt; }
ul,ol{ margin-bottom:2.6mm; }
li{ margin-bottom:1.1mm; }
.gloss{ column-count:2; column-gap:7mm; font-size:8.6pt; line-height:1.45; }
.gloss dt{ margin-top:2.2mm; font-size:8.8pt; break-after:avoid; }
.gloss dd{ break-inside:avoid; }
.refs{ column-count:2; column-gap:7mm; font-size:8pt; line-height:1.42; }
.coverpts div{ font-size:9pt; }
</style>
</head>
<body>
