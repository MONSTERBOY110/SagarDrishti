# SagarDrishti CI skeleton (TRD §9).
#
# NOTE: authored but never executed yet -- it runs on the first push that
# includes it (remote: github.com/MONSTERBOY110/SagarDrishti). Jobs are ordered
# by what actually breaks the demo: data plane first, then types, then the
# offline path.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  house-style:
    name: house style (typography rule)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the guard asks git for the tracked file list
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The team lead's rule is zero em and en dashes. It was applied once
      # across 167 instances; without a guard the next paragraph reintroduces
      # them. Cheap job, runs in seconds, fails loudly with the file and line.
      - name: No em or en dashes
        run: python tools/check_dashes.py

  data-plane:
    name: data plane (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"        # see docs/adr/0002-python-311.md
          cache: pip
      - name: Install
        run: pip install -r services/api/requirements-dev.txt
      - name: Unit tests (CF edge cases, QC filtering, colorbar mapping)
        working-directory: services/api
        run: pytest -q

  web:
    name: web (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm web:typecheck
      - run: pnpm web:build

  agent:
    name: agent plane (tools, guard, refusals)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # The agent's own tests stub the data plane, so this job needs no cube
      # and no API: it tests the planner and the no-fabrication guard, which
      # are the two things about the agent that are worth failing a build over.
      - run: pip install -r services/api/requirements-dev.txt
      - name: Agent tests
        run: python -m pytest services/agent/tests -q

  offline:
    name: offline path (OFFLINE=1, no network)
    runs-on: ubuntu-latest
    needs: data-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r services/api/requirements-dev.txt
      # Builds the cube from data/sample - no network, no INCOIS, real data.
      - name: Build cube from the committed sample
        run: python tools/preprocess.py --fixtures
      - name: Boot API and hit the demo endpoints
        env:
          OFFLINE: "1"
        run: |
          cd services/api
          uvicorn app.main:app --port 8000 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/healthz && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/healthz | tee /dev/stderr | grep -q '"offline":true'
          curl -sf "http://127.0.0.1:8000/catalog" > /dev/null
          # The two newest routes read from disk like everything else, so they
          # are part of the air-gapped promise and are checked here rather than
          # assumed. The scorecard must produce pairs; the hazard layer must at
          # minimum answer, since a deployment with no feed legitimately has no
          # warnings.
          curl -sf "http://127.0.0.1:8000/scorecard/incois_vam_argo/TEMP" \
            | grep -q '"rmse"'
          curl -sf "http://127.0.0.1:8000/warnings?at=2026-07-30T00:00:00Z&rehearsal=true" \
            | grep -q '"alerts"'

  e2e:
    name: demo path (production build, air-gap guard)
    runs-on: ubuntu-latest
    needs: [data-plane, web, agent]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r services/api/requirements-dev.txt
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      # No network, and REAL data: `--fixtures` builds from data/sample, which
      # holds 614 KB of genuine INCOIS field and Argo profiles committed for
      # exactly this (see data/sample/README.md). So this job never reaches a
      # government server and cannot go red because one is down, and it still
      # runs the same cube the demo runs.
      #
      # It used to build a small INVENTED field instead, and that was a hole
      # rather than a simplification. The demo-path assertions are claims about
      # the real Bay of Bengal by design (the surface is warmer than 2000 m,
      # the cartouche cites incois_argo_10d_VAM, a BGC float really serves
      # chlorophyll, the 26 degC surface varies in depth), and four of the six
      # browser tests could not pass against an invented field however correct
      # the application was. Measured on 2026-09-09: 2 passed, 4 failed, all
      # four because the app truthfully reported synthetic data.
      - name: Build the cube from the committed sample
        run: .venv/bin/python tools/preprocess.py --fixtures
      # NOT a production build step any more. playwright.config.ts builds the
      # web client itself, inside its own webServer command, because
      # NEXT_PUBLIC_* is inlined at BUILD time: building here with no API base
      # bakes in the default port 8000, and the suite then boots its API on
      # 8100 and the page calls a port nothing is listening on. That failed
      # silently as an empty scene. The build below stays only as a TYPE and
      # BUILD check of the client in its own right.
      - name: Web client builds at all
        run: pnpm web:build
      # The suite boots its own API and web server (see playwright.config.ts) and
      # fails on ANY off-origin request, which is how PRD F11's air-gapped promise
      # is enforced mechanically rather than by inspection.
      - name: Demo path
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 7
