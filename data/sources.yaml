# SagarDrishti - dataset registry (TRD M1)
#
# THIS FILE IS THE EXTENSIBILITY SURFACE. Adding a variable, a depth level range,
# or a whole new source is an edit here - never a code change. That is PS
# requirement F3 ("Multi-format Data Ingestion") and F6 ("Extensible Design"),
# and we demo it live by editing this file on stage (PRD §11 step 6).
#
# Every entry is validated against services/api/app/registry.py:SourceSpec.
# `cf_overrides` exists because real government NetCDF is not CF-clean - each
# override below documents an actual defect observed in the live source, with
# the date we observed it. Do not "tidy" these away.

version: 1

defaults:
  # Bay of Bengal + Arabian Sea - the offline demo cube footprint (TRD §3)
  bbox: [30.0, -30.0, 120.0, 30.0]   # [west, south, east, north]
  demo_bbox: [80.0, 5.0, 95.0, 25.0] # Bay of Bengal, the Phase 1 spike box

sources:

  # ---------------------------------------------------------------------------
  # PRIMARY model/analysis field for Phase 1 (ADR-0003).
  # Open, no login, INCOIS-native, genuinely 4D. Verified live 2026-09-07:
  # time=813 steps (latest 2026-07-30), ZAX=24 levels 5-2000 m, 1 deg grid.
  # ---------------------------------------------------------------------------
  - id: incois_vam_argo
    title: "INCOIS Argo 10-day gridded analysis (Variational Analysis Method)"
    kind: erddap_griddap
    enabled: true
    url: https://erddap.incois.gov.in/erddap
    dataset_id: incois_argo_10d_VAM
    citation: "INCOIS ERDDAP, incois_argo_10d_VAM (Variational Analysis Method, 10-day gridded Argo analysis)"
    variables:
      - name: TEMP
        canonical: sea_water_temperature
        label: Temperature
      - name: SAL
        canonical: sea_water_practical_salinity
        label: Salinity
      - name: TERR
        canonical: sea_water_temperature_error
        label: Temperature relative error
      - name: SERR
        canonical: sea_water_practical_salinity_error
        label: Salinity relative error
    dims:
      time: time
      depth: ZAX          # non-standard name; cf-xarray cannot infer it
      lat: latitude
      lon: longitude
    cf_overrides:
      # Observed 2026-09-07 on the live dataset:
      ZAX:
        standard_name: depth
        units: m
        positive: down    # ABSENT in the source. Without this, depth sign is a guess.
        axis: Z
      TEMP:
        units: degC       # source says "degs" -- not a UDUNITS/CF unit
        _FillValue: -9999.0
      SAL:
        units: "1"        # PSU is dimensionless in CF terms
        _FillValue: -9999.0
      TERR:
        units: degC
        _FillValue: -9999.0
      SERR:
        units: "1"
        _FillValue: -9999.0

  # ---------------------------------------------------------------------------
  # PS-official Argo profiles. Daily basin-aggregated files - one HTTP GET gives
  # every Indian-Ocean profile for a day. Do NOT use ar_index_global_prof.txt
  # (316 MB, verified 2026-09-07).
  # ---------------------------------------------------------------------------
  - id: argo_gdac_indian
    title: "Argo GDAC (Ifremer) - Indian Ocean daily profile files"
    kind: gdac_geo
    enabled: true
    url: https://data-argo.ifremer.fr/geo/indian_ocean
    path_template: "{year}/{month:02d}/{year}{month:02d}{day:02d}_prof.nc"
    citation: "Argo GDAC (Ifremer), geo/indian_ocean daily profile files. Argo float data collected and made freely available by the International Argo Program."
    variables:
      - name: TEMP
        canonical: sea_water_temperature
        label: Temperature
        units: "degree_Celsius"
      - name: PSAL
        canonical: sea_water_practical_salinity
        label: Salinity
        units: "psu"
    qc:
      # PRIOR-ART.md §E.4 / Wong et al. 2020: good + probably-good only.
      accept_flags: [1, 2]
      prefer_adjusted: true   # use TEMP_ADJUSTED when its QC allows
    dims:
      profile: N_PROF
      level: N_LEVELS
    # DOCUMENTATION, not an applied correction. cf_overrides is consumed in
    # exactly one place, app/cf.py:normalize_dataset, which runs only on
    # gridded sources. An Argo file is parsed by app/argo.py, which reads the
    # pressure axis itself and never looks at this block. It is kept because it
    # records the convention a reader must know: PRES is decibars, NOT metres,
    # and app/argo.py converts it with gsw.z_from_p (TEOS-10).
    cf_overrides:
      PRES:
        standard_name: sea_water_pressure
        units: dbar
        positive: down

  # ---------------------------------------------------------------------------
  # The ASCII half of F3. Cruise CTD and glider text casts. Adding another text
  # layout is another entry here and NO code change: that is the whole claim,
  # and app/text_profiles.py documents the schema.
  #
  # SCOPE, STATED PRECISELY. This handles delimited text that carries a
  # COLUMN-NAME ROW, which covers ERDDAP tabledap exports, most glider CSV and
  # hand-prepared cruise tables. It does NOT handle a raw Sea-Bird Seasave
  # .cnv: Seasave declares its columns in "# name 0 = prDM: Pressure" header
  # lines and then writes a fixed-width numeric block with no column-name row
  # at all, and the parser raises rather than guessing. An earlier draft of this
  # entry was titled ".cnv style" with path_template "*.cnv", which promised
  # something the code cannot do; supporting real .cnv is tracked as a Phase 2
  # item in docs/ROADMAP.md.
  #
  # No files are on disk under data/raw/ctd yet. The entry is live so the
  # config path is real and testable; tools/preprocess.py ingests whatever
  # appears there.
  # ---------------------------------------------------------------------------
  - id: ctd_text_ascii
    title: "Cruise CTD / glider profiles (delimited text with a column-name row)"
    kind: file
    enabled: true
    url: data/raw/ctd
    path_template: "*.txt"
    citation: "Cruise CTD / glider delimited-text profiles; per-file provenance in data/cube/provenance.json"
    variables:
      - name: TEMP
        canonical: sea_water_temperature
        label: Temperature
      - name: PSAL
        canonical: sea_water_practical_salinity
        label: Salinity
    qc:
      accept_flags: [1, 2]
      prefer_adjusted: false   # a text cast has no *_ADJUSTED variant
    text:
      encoding: auto
      comment_prefixes: ["*", "#", "%"]
      delimiter: auto
      decimal: auto
      column_row: auto
      units_row: false
      columns:
        pres: ["Pressure", "prDM", "PRES"]
        temp: ["Temperature", "t090C", "TEMP", "Temp"]
        psal: ["Salinity", "sal00", "PSAL", "Sal"]
        qc: ["Flag", "flag"]
      header_metadata:
        platform: ["Station", "Platform", "platform_code"]
        cast: ["Cast"]
        lat: ["NMEA Latitude", "Latitude", "Lat"]
        lon: ["NMEA Longitude", "Longitude", "Lon"]
        time: ["NMEA UTC (Time)", "Date", "start_time"]
      time_formats: ["%b %d %Y %H:%M:%S", "%Y-%m-%d %H:%M:%S"]
      profile_id_from: ["platform", "cast", "time"]
      platform_prefix: CTD   # keeps a station id from colliding with an Argo WMO
      # -1.0e+34 needs the SIGNED exponent: PyYAML follows YAML 1.1, where
      # "-1.0e34" loads as a string, not a float.
      missing: [-999, -9.99, -1.0e+34, "NaN", "n/a", "---"]
      vertical:
        column: auto
        units: auto
        positive: auto
      derive_pressure: true
      flags:
        map: {}            # this family already writes Argo 1-9
        when_absent: 1
        when_blank: 9

  # ---------------------------------------------------------------------------
  # The SAME parser, a completely different format. Kept as a separate entry
  # because ODV repeats "QF" after every data column while a plain cast writes
  # one unqualified level flag - only ODV sets qc_follows_value.
  # ---------------------------------------------------------------------------
  - id: odv_spreadsheet
    title: "Ocean Data View spreadsheet export (profiles)"
    kind: file
    enabled: true
    url: data/raw/odv
    path_template: "*.txt"
    citation: "Ocean Data View spreadsheet export; per-file provenance in data/cube/provenance.json"
    variables:
      - name: TEMP
        canonical: sea_water_temperature
        label: Temperature
      - name: PSAL
        canonical: sea_water_practical_salinity
        label: Salinity
    qc:
      accept_flags: [1, 2]
      prefer_adjusted: false
    text:
      encoding: auto
      comment_prefixes: ["//"]
      delimiter: tab
      columns:
        platform: ["Station"]
        time: ["yyyy-mm-ddThh:mm:ss.sss"]
        lat: ["Latitude"]
        lon: ["Longitude"]
        pres: ["Pressure"]
        depth: ["Depth", "DEPTH"]
        temp: ["Temperature", "Temp"]
        psal: ["Salinity", "Sal"]
        qc: ["QF", "QV:ODV"]
      # ODV repeats "QF" after every data column, so a flag can only be bound
      # to the value it follows.
      qc_follows_value: true
      # Identity cells are written on a station's FIRST row only.
      forward_fill_identity: true
      time_formats: ["%Y-%m-%dT%H:%M:%S.%f"]
      profile_id_from: ["platform", "time"]
      platform_prefix: ODV
      # ODV puts the unit in the column name ("Pressure [db]"), so the vertical
      # axis resolves from there with no units row at all.
      vertical:
        column: auto
        units: auto
        positive: auto
      derive_pressure: true
      flags:
        # SeaDataNet vocabulary, NOT Argo's: 0 = no QC, 1 = good,
        # 2 = probably good, 3 = probably bad, 4 = bad, 8 = interpolated
        # (Argo's 3), 9 = missing.
        map: {"0": 1, "1": 1, "2": 2, "3": 3, "4": 4, "8": 3, "9": 9}
        when_absent: 1
        when_blank: 9


  # ---------------------------------------------------------------------------
  # The "BGC" instrument class named in PRD F2, from real Argo biogeochemical
  # floats. Synthetic profile files (<wmo>_Sprof.nc), which is where a BGC
  # float's chlorophyll, oxygen, nitrate and pH actually live: the core
  # geo/indian_ocean daily files carry TEMP and PSAL only, so a BGC float
  # appears there as an ordinary float with its biogeochemistry missing.
  #
  # HOW THE FLOATS ARE FOUND. Not from a hardcoded list. tools/fetch_sample.py
  # reads PLATFORM_TYPE out of the core daily files already on disk, keeps the
  # ones whose type contains "BGC" and whose position falls in the demo box,
  # and maps DATA_CENTRE to the DAC directory. A pinned WMO list would go stale
  # the moment a float stopped reporting; `platforms:` below exists only to pin
  # a known-good float for a rehearsal.
  #
  # THREE THINGS THIS SOURCE PROVED, all of them real and all of them the kind
  # of defect the CF and QC work exists for:
  #
  #  1. `prefer_adjusted` is load-bearing, not a nicety. On float 1902367 the
  #     raw CHLA_QC is flag 3 on every single one of its 13,934 measured
  #     levels, and flag 4 on two more. Nothing is flag 1 or 2. Only
  #     CHLA_ADJUSTED_QC reaches flag 2 (13,688 levels). A reader that ignored
  #     the adjusted product and applied our own accept_flags [1, 2] would
  #     therefore serve ZERO chlorophyll and look like a plumbing failure.
  #     DOXY is the same shape: raw all flag 3, adjusted all flag 1.
  #
  #  2. A third fill convention. INCOIS VAM uses -9999.0, the value-added
  #     products use -1.0E34, and these files use 99999.0. All three are
  #     declared in the file and handled by xarray's mask_and_scale, which is
  #     exactly why app/cf.py trusts the declaration instead of hunting for
  #     magic numbers.
  #
  #  3. Raw BGC values are not physical until adjusted. Raw CHLA runs to
  #     -0.993 mg/m3 (negative chlorophyll, from fluorometer dark-offset
  #     drift) and raw PH_IN_SITU_TOTAL spans -381.6 to 157.6 against an ocean
  #     range of roughly 7.4 to 8.2. The QC flags reject them and our policy
  #     drops them. This is the clearest available answer to "why not just plot
  #     the file".
  #
  # QC POLICY, STATED PRECISELY. accept_flags stays [1, 2], so Argo flag 5
  # ("value changed") and flag 8 ("estimated/interpolated") are REJECTED even
  # though some BGC workflows accept them. On float 1902367 that costs 246
  # flag-5 and 2 flag-8 chlorophyll levels. Deliberate: a number on stage
  # should be one a float measured, not one somebody interpolated, and if a
  # judge asks we can say which flags we take and why in one sentence.
  # ---------------------------------------------------------------------------
  - id: argo_bgc_indian
    title: "Argo BGC floats (synthetic profiles) - Indian Ocean"
    kind: gdac_bgc
    enabled: true
    url: https://data-argo.ifremer.fr/dac
    path_template: "{dac}/{wmo}/{wmo}_Sprof.nc"
    citation: "Argo GDAC (Ifremer), BGC synthetic profiles (Sprof). Argo float data collected and made freely available by the International Argo Program and the national programmes that contribute to it."
    platforms: []          # discovered from the core files; see the note above
    variables:
      - name: TEMP
        canonical: sea_water_temperature
        label: Temperature
        units: "degree_Celsius"
      - name: PSAL
        canonical: sea_water_practical_salinity
        label: Salinity
        units: "psu"
      - name: DOXY
        canonical: moles_of_oxygen_per_unit_mass_in_sea_water
        label: Dissolved oxygen
        units: "micromole/kg"
      - name: CHLA
        canonical: mass_concentration_of_chlorophyll_a_in_sea_water
        label: Chlorophyll-a
        units: "mg/m3"
      - name: NITRATE
        canonical: moles_of_nitrate_per_unit_mass_in_sea_water
        label: Nitrate
        units: "micromole/kg"
      - name: PH_IN_SITU_TOTAL
        canonical: sea_water_ph_reported_on_total_scale
        label: pH
        units: "dimensionless"
      - name: BBP700
        canonical: volume_scattering_function_of_radiative_flux_in_sea_water
        label: Particle backscattering (700 nm)
        units: "m-1"
    qc:
      accept_flags: [1, 2]
      prefer_adjusted: true   # see note 1 above: without this, no chlorophyll
    dims:
      profile: N_PROF
      level: N_LEVELS
    # DOCUMENTATION, not an applied correction. cf_overrides is consumed in
    # exactly one place, app/cf.py:normalize_dataset, which runs only on
    # gridded sources. An Argo file is parsed by app/argo.py, which reads the
    # pressure axis itself and never looks at this block. It is kept because it
    # records the convention a reader must know: PRES is decibars, NOT metres,
    # and app/argo.py converts it with gsw.z_from_p (TEOS-10).
    cf_overrides:
      PRES:
        standard_name: sea_water_pressure
        units: dbar
        positive: down



  # ---------------------------------------------------------------------------
  # A MOORED BUOY, and the running example for the source-reader half of the
  # plugin interface (PS requirement F6, which names moorings by name).
  #
  # The plugin framework has offered two extension points from the start.
  # Derived products had a live example (D26); source readers had a checked
  # contract, error codes D1 to D5, documentation, and nothing registered
  # against them. `kind: mooring` here is served by
  # services/api/plugins/rama_mooring.py, so both halves now have something
  # running rather than one half having only tests.
  #
  # WHY THIS SOURCE. RAMA is the Research moored Array for African-Asian-
  # Australian Monsoon Analysis, the Indian Ocean arm of the global tropical
  # moored buoy array, and INCOIS is one of its partners. Three of its moorings
  # sit inside the demo box on the 90 E line, at 8 N, 12 N and 15 N, and they
  # report DAILY and CURRENTLY: 15n90e (WMO 23009) returned 17 levels from 1 m
  # to 500 m for 2026-07-30, the same day as the model timestep the scene opens
  # on. Contemporaneity is the property that made this worth ingesting and the
  # Oceansat-2 chlorophyll source not.
  #
  # THREE REAL DEFECTS THIS SOURCE BRINGS, all handled in the reader:
  #
  #  1. A DIFFERENT QC VOCABULARY. TAO/RAMA flags are 0 no sensor, 1 highest
  #     quality, 2 default quality, 3 adjusted, 4 lower quality, 5 SENSOR
  #     FAILED. Argo's scale means something different above 2 and has no 5 at
  #     all, so the two agree on 1 and 2 by coincidence and disagree beyond.
  #     Filtering RAMA flags with Argo's rules would compare a failed sensor
  #     against a scale it does not belong to. The reader maps them explicitly.
  #
  #  2. A FOURTH FILL CONVENTION, 1.0E35. The cube already handles -9999.0
  #     (VAM), -1.0E34 (value-added and ocean colour) and 99999.0 (Argo BGC).
  #     None is a rounding of another.
  #
  #  3. A FLAT TABLE, NOT A GRID. ERDDAP tabledap serves one row per
  #     (time, depth) with the position repeated on every row, 527 rows for one
  #     mooring over a month. The reader pivots it, using the depths actually
  #     present rather than an assumed set, because a mooring loses and regains
  #     sensors mid-deployment.
  #
  # `url` is a LOCAL DIRECTORY, not an endpoint, and that is the offline rule
  # rather than an oddity: tools/fetch_sample.py is the only file that touches
  # the network, and a reader runs against what it left on disk.
  # ---------------------------------------------------------------------------
  - id: rama_mooring_bob
    title: "RAMA moored buoys, Bay of Bengal (90 E line)"
    kind: mooring
    enabled: true
    url: data/raw/moorings
    path_template: "rama_*.nc"
    citation: >-
      TAO/TRITON, RAMA and PIRATA moored buoy array, NOAA PMEL, served via the
      OSMC ERDDAP (dataset pmelTaoDyT). RAMA is supported by NOAA PMEL, India's
      Ministry of Earth Sciences and INCOIS, JAMSTEC, BMKG and CSIRO.
    # Empty means "discover them": tools/fetch_sample.py asks the array which
    # stations lie in the demo box rather than trusting a pasted list, the same
    # way the BGC floats are found. Pin one here only to force a rehearsal onto
    # a known-good mooring.
    platforms: []
    variables:
      - name: TEMP
        canonical: sea_water_temperature
        label: Temperature
        units: "degC"
    dims:
      time: time
      depth: depth
    qc:
      # After the reader has mapped RAMA's vocabulary onto this scale. Same
      # policy as every other instrument in the project, which is the point of
      # mapping rather than special-casing.
      accept_flags: [1, 2]
      prefer_adjusted: false

  # ---------------------------------------------------------------------------
  # INCOIS ocean colour. The PS names CHLOROPHYLL among the fields F1 asks for,
  # and this is INCOIS's own product for it, on the same open ERDDAP the model
  # field comes from. It is registered here, and DISABLED, and the three
  # reasons are worth stating because each one is a decision rather than a
  # missing feature.
  #
  # 1. IT IS NOT CONTEMPORANEOUS. The series ends 2020-05-01. The model cube
  #    covers three dates in July 2026. There is no honest way to draw a 2020
  #    field under the same time scrubber as a 2026 one: a scrubber reading
  #    2026-07-30 above a 2020 chlorophyll layer is a false statement made by
  #    the interface itself, and it would be made silently. Nothing in the
  #    scene today can express "this layer has its own epoch", so the choice is
  #    between building that and not drawing the layer.
  #
  # 2. IT IS A SURFACE FIELD. Ocean colour is measured by satellite and has no
  #    profile, so this source has dims (time, lat, lon) and NO vertical axis,
  #    while every cube in the store today is 4D. A sweep of the codebase found
  #    the client is single-dataset by construction and would answer
  #    "the depth cursor is at NaN metres", print "0 depth levels from 0 to 0
  #    metres", and unmount the scale bar (taking the frame-rate readout with
  #    it) for a source with no levels. Three real bugs that sweep found are
  #    already fixed, because they were live without this source; the client
  #    empty-state work is not, and drawing this layer without it would look
  #    broken in a way a judge would reasonably read as broken.
  #
  # 3. PAYLOAD. At 0.04 degrees this is roughly 375 x 500 = 187,500 cells for
  #    ONE surface timestep inside the demo box, against 300 cells per level
  #    and 7,200 for the ENTIRE 24-level volumetric column. A single timestep
  #    is about 26 times the whole water column we render today, and /field
  #    transports it as a JSON array of nullable floats. The ingest has to
  #    decimate before any of this is worth scheduling, and the decimation
  #    factor is a decision with a scientific cost that nobody has taken yet.
  #
  # WHAT IT WOULD TAKE, so the estimate is on the record rather than rediscovered:
  # a `vertical: surface` marker and an epoch marker in the registry, a
  # depth-tolerant catalog entry, an empty-state path through the depth rack,
  # scale bar and scene summary, a decimating ingest, and a time axis that
  # refuses to join two epochs. That is a real piece of work and it is not on
  # the PS's own P0 list, so it waits behind the requirements that are.
  #
  # Chlorophyll DOES already reach the screen from the other direction: the BGC
  # floats under `argo_bgc_indian` carry measured chlorophyll PROFILES that are
  # contemporaneous with the model field, and those are live.
  #
  # Probed 2026-09-08. CHL is mg/m3, KD490 is m-1, TSM is mg/L, all three with
  # _FillValue -1.0E34, which is the second of the three fill conventions the
  # CF layer already handles.
  # ---------------------------------------------------------------------------
  - id: incois_oceansat2_chl
    title: "INCOIS Oceansat-2 OCM ocean colour (surface, 2011 to 2020)"
    kind: erddap_griddap
    enabled: false
    disabled_reason: >-
      Not contemporaneous with the model field: the series ends 2020-05-01
      while the cube covers July 2026, and the scene cannot yet express a layer
      with its own epoch. Also a SURFACE source with no vertical axis, which
      the single-dataset client has no empty state for, and about 187,500 cells
      per timestep against 7,200 for the entire volumetric column, so the
      ingest needs a decimation decision first. Contemporaneous chlorophyll IS
      available as BGC float profiles, see argo_bgc_indian.
    url: https://erddap.incois.gov.in/erddap
    dataset_id: incois_oceansat2_datasets
    citation: "INCOIS ERDDAP, incois_oceansat2_datasets (Oceansat-2 OCM ocean colour)."
    variables:
      - name: CHL
        canonical: mass_concentration_of_chlorophyll_a_in_sea_water
        label: Chlorophyll-a
        units: "mg/m3"
      - name: KD490
        canonical: volume_attenuation_coefficient_of_downwelling_radiative_flux_in_sea_water
        label: Diffuse attenuation at 490 nm
        units: "m-1"
      - name: TSM
        canonical: mass_concentration_of_suspended_matter_in_sea_water
        label: Total suspended matter
        units: "mg/L"
    dims:
      time: time
      lat: latitude
      lon: longitude
      # NO depth. Deliberately absent rather than left over from a copied
      # entry: app/cf.py skips a declared axis it cannot find, so a stale
      # `depth: ZAX` here would be silently ignored and the source would look
      # volumetric in the config while being flat in the data.
    cf_overrides:
      CHL:
        _FillValue: -1.0e34
      KD490:
        _FillValue: -1.0e34
      TSM:
        _FillValue: -1.0e34

  # ---------------------------------------------------------------------------
  # PS-official reanalysis. DISABLED until Copernicus credentials exist.
  # The ONLY source with depth-resolved currents (U/V) - required by F1's
  # current-vector layer. Enable = set enabled: true + put creds in .env.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # DEPTH-RESOLVED CURRENTS. The problem statement names current vectors among
  # the fields F1 must render, and INCOIS's free ERDDAP publishes SURFACE
  # geostrophic currents only, so this is the one part of F1 that no INCOIS
  # source can answer. It was blocked on a Copernicus account until 2026-09-09.
  #
  # THE DATASET ID CHANGED WHEN THE ACCOUNT ARRIVED, and the reason is the same
  # trap that keeps the Oceansat-2 chlorophyll source disabled below.
  #
  # This entry originally named `cmems_mod_glo_phy_my_0.083deg_P1D-m`, the
  # GLORYS12V1 multi-year REANALYSIS. Probed with real credentials on
  # 2026-09-09, that product runs 1993-01-01 to **2026-06-23**. Our cube's three
  # analysis steps are 2026-07-10, 07-20 and 07-30. Every one of them is after
  # the reanalysis ends, so the originally configured source could not have
  # produced a single contemporaneous field, and a time scrubber reading
  # 2026-07-30 above a June current layer would be a false statement made by
  # the interface itself.
  #
  # `cmems_mod_glo_phy-cur_anfc_0.083deg_P1D-m` is the analysis-and-forecast
  # CURRENTS product: 2022-06-01 to 2026-09-18, 50 levels from 0.5 to 5728 m,
  # carrying exactly `uo` and `vo`. It covers all three of our dates.
  #
  # Temperature and salinity are deliberately NOT taken from here even though
  # the reanalysis carries them. INCOIS's own analysis is the PS-preferred
  # source and is what the scorecard verifies; adding a second temperature
  # field would mean two answers to one question with nothing to choose
  # between them.
  #
  # GRID. 1/12 degree over the demo box is 241 x 181 cells per level against
  # the INCOIS analysis's 21 x 16, so a level here is 128 times the cells. That
  # is the visual upgrade the account buys and it is also why currents are
  # drawn as a DECIMATED VECTOR FIELD rather than as volumetric slices: 43,561
  # arrows on one level is not a picture anybody can read, and the JSON for it
  # would not fit the frame budget in TRD section 5.
  #
  # Its depth axis is its OWN (40 levels to 1942 m, none of them shared with
  # the INCOIS 24). It is not regridded onto the INCOIS levels: that would be
  # an interpolation nobody asked for, applied to make two products look like
  # one. The client asks for the nearest GLORYS level to the depth cursor and
  # the response says which level it actually got.
  # ---------------------------------------------------------------------------
  - id: glorys12_cur
    title: "Copernicus GLORYS analysis and forecast, currents (1/12 deg, 50 levels)"
    kind: copernicus
    enabled: true
    url: https://data.marine.copernicus.eu
    dataset_id: cmems_mod_glo_phy-cur_anfc_0.083deg_P1D-m
    citation: >-
      E.U. Copernicus Marine Service Information, Global Ocean Physics Analysis
      and Forecast (GLOBAL_ANALYSISFORECAST_PHY_001_024), currents product
      cmems_mod_glo_phy-cur_anfc_0.083deg_P1D-m. Generated using E.U. Copernicus
      Marine Service Information.
    variables:
      - name: uo
        canonical: eastward_sea_water_velocity
        label: Eastward current
        units: "m s-1"
      - name: vo
        canonical: northward_sea_water_velocity
        label: Northward current
        units: "m s-1"
    dims:
      time: time
      depth: depth
      lat: latitude
      lon: longitude
    cf_overrides: {}   # Copernicus is CF-clean; kept explicit to prove the contrast

  # ---------------------------------------------------------------------------
  # The OFFLINE=1 target. Written by tools/preprocess.py, read by the API.
  # The API reads ONLY from here, so the offline path is the default code path
  # (TRD M6) rather than a special case bolted on later.
  # ---------------------------------------------------------------------------
  - id: local_cube
    title: "Local preprocessed cube (offline demo)"
    kind: zarr
    enabled: true
    url: data/cube
    members:
      - store: incois_vam_bob.zarr
        from_source: incois_vam_argo
      - store: profiles.parquet
        from_source: argo_gdac_indian
        format: parquet
    citation: "Derived from the sources named in each store's provenance.json"

  # ---------------------------------------------------------------------------
  # HazardWatch (PRD F13, TRD M8). The problem statement's portal theme IS
  # Disaster Management and "timely hazard assessment" is its first stated
  # mandate, so these two entries are the half of the brief the field layers do
  # not answer.
  #
  # WHY TWO SOURCES AND NOT ONE, which is the honest part of this feature.
  #
  # TRD M8 planned for curated CAP samples "where a machine feed isn't public".
  # Probing on 2026-09-09 found that one IS: NDMA SACHET, India's national CAP
  # backbone, publishes a live public RSS index of real CAP v1.2 alerts, and it
  # carried 99 of them that afternoon from CWC, IMD and the state disaster
  # authorities. That is strictly better than anything we could write, so it is
  # the first source and the parser is proven against it.
  #
  # What that feed did NOT carry at ingest time is any of the three OCEAN
  # hazards the PS names by name: tsunami, high wave, swell surge. Those come
  # from INCOIS's own ITEWC, which is a UNESCO-IOC Tsunami Service Provider and
  # does issue CAP, but the same probe found no public machine-readable CAP or
  # RSS endpoint for it (tsunami.incois.gov.in answers, its ITEWS/cap.jsp and
  # ITEWS/rss.jsp do not). So the ocean hazards are the second source, and
  # every file in it is marked with CAP's OWN `status: Exercise`.
  #
  # `Exercise` is not a workaround. It is the field the standard provides for
  # exactly this case, it is what a real drill uses, and it means no file we
  # authored can ever be mistaken for a live warning by any CAP reader,
  # including ours: app/cap.py refuses a non-Actual alert unless a caller asks
  # for a rehearsal, and the panel that draws one is required to say so.
  # ---------------------------------------------------------------------------
  - id: cap_sachet_india
    title: "NDMA SACHET national CAP alert feed (India)"
    kind: cap
    enabled: true
    # The RSS index. tools/fetch_sample.py walks it, pulls each CAP document
    # and the polygon sidecar SACHET puts the geometry in, and leaves them in
    # the local directory below. The API never sees this URL.
    url: https://sachet.ndma.gov.in/cap_public_website/rss/rss_india.xml
    path_template: data/raw/cap/sachet
    citation: >-
      Common Alerting Protocol bulletins issued in the public interest by
      Indian government agencies (India Meteorological Department, Central
      Water Commission and the State Disaster Management Authorities) and
      disseminated through NDMA SACHET, India's national CAP backbone.

  - id: cap_incois_ocean
    title: "INCOIS ocean-hazard bulletins, CAP v1.2 (rehearsal set)"
    kind: cap
    enabled: true
    # A LOCAL directory. There is no endpoint because there is no public
    # machine feed; see the block above.
    url: data/warnings/incois
    path_template: "*.cap.xml"
    citation: >-
      Ocean-hazard bulletins in OASIS CAP v1.2, authored for this project and
      modelled on the bulletin structure of the Indian Tsunami Early Warning
      Centre (ITEWC) at INCOIS, a UNESCO-IOC Tsunami Service Provider. Every
      file carries CAP status Exercise: these are rehearsal bulletins and are
      not, and must never be presented as, live warnings. No public
      machine-readable CAP feed for ITEWC was found when this was written
      (probed 2026-09-09).
